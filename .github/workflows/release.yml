name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Nops.slnx

      - name: Build
        run: dotnet build Nops.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Nops.slnx --no-build -c Release --filter "FullyQualifiedName!~Integration" --verbosity normal

      - name: Pack
        run: dotnet pack Nops.slnx -c Release -o nupkgs --no-build

      - name: Push packages to NuGet
        run: |
          dotnet nuget push "nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
          dotnet nuget push "nupkgs/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
