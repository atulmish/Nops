name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify tag matches version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag v$tag does not match Directory.Build.props version $version"
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore Nops.slnx

      - name: Build
        run: dotnet build Nops.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Nops.slnx --no-build -c Release --filter "FullyQualifiedName!~Integration" --verbosity normal

      - name: Pack
        run: dotnet pack Nops.slnx -c Release -o nupkgs --no-build

      - name: NuGet login (OIDC to short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: atulmish

      - name: Push packages to NuGet
        run: |
          dotnet nuget push "nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
          dotnet nuget push "nupkgs/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Generate SBOMs (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          mkdir sbom
          for proj in src/*/*.csproj; do
            name=$(basename "$proj" .csproj)
            dotnet-CycloneDX "$proj" -o sbom -fn "$name.cdx.json" -F Json -sv "${GITHUB_REF_NAME#v}" -t
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            nupkgs/*.nupkg
            sbom/*.json
