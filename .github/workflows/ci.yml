name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Nops.slnx

      - name: Build
        run: dotnet build Nops.slnx --no-restore -c Release

      - name: Run format check
        run: dotnet format --verify-no-changes --severity warn --verbosity minimal

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Nops.slnx

      - name: Build
        run: dotnet build Nops.slnx --no-restore -c Release

      - name: Run tests with coverage
        run: dotnet test Nops.slnx --no-build -c Release --filter "FullyQualifiedName!~Integration" --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage \
            -assemblyfilters:"+Nops.*;-*.Tests" -reporttypes:"MarkdownSummaryGithub;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce line coverage
        run: |
          rate=$(grep -oP '<coverage[^>]*line-rate="\K[0-9.]+' coverage/Cobertura.xml | head -1)
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          echo "Line coverage: ${pct}% (minimum 95%)"
          awk -v r="$rate" 'BEGIN { exit (r >= 0.95) ? 0 : 1 }' || { echo "::error::Line coverage ${pct}% is below the 95% minimum"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/

      - name: Verify no cloud refs in Nops.Core
        run: |
          cloud_pkgs=$(dotnet list src/Nops.Core/Nops.Core.csproj package --include-transitive \
            | grep -E "AWSSDK|Google\.Cloud|Azure\.Security|HashiCorp" || true)
          if [ -n "$cloud_pkgs" ]; then
            echo "ERROR: Nops.Core must not reference cloud SDK packages:"
            echo "$cloud_pkgs"
            exit 1
          fi
          echo "PASS: Nops.Core has no cloud SDK references"

  sops-verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install SOPS
        run: |
          SOPS_VERSION=v3.13.3
          curl -sLO "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          chmod +x "sops-${SOPS_VERSION}.linux.amd64"
          sudo mv "sops-${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops
          sops --version

      - name: Verify fixtures match plaintext
        env:
          SOPS_TEST_AGE_KEY: ${{ secrets.SOPS_TEST_AGE_KEY }}
        run: |
          # Fixtures are generated with the committed TEST-ONLY keys. The
          # multi-keygroup fixture requires two of the three identities, so always
          # include the committed keys (optionally alongside a CI-provided key).
          committed=$(grep AGE-SECRET-KEY tests/Nops.Core.Tests/Fixtures/AGE-TEST-KEY.txt | tr '\n' ' ')
          export SOPS_AGE_KEY="${SOPS_TEST_AGE_KEY:-} $committed"
          # pgp.sops.yaml is encrypted to the committed TEST-ONLY PGP key.
          gpg --batch --import tests/Nops.Core.Tests/Fixtures/PGP-TEST-KEY.asc
          fail=0
          for f in tests/Nops.Core.Tests/Fixtures/*.sops.*; do
            plain="${f}.plain"
            [ -f "$plain" ] || continue
            if ! sops decrypt "$f" > /tmp/decrypted 2>/tmp/sops_err; then
              echo "FAIL: sops could not decrypt $f"
              cat /tmp/sops_err
              fail=1
              continue
            fi
            if ! diff -q "$plain" /tmp/decrypted > /dev/null; then
              echo "FAIL: fixture mismatch: $f"
              diff "$plain" /tmp/decrypted | head -20
              fail=1
            else
              echo "OK: $f"
            fi
          done
          exit $fail

  pack:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack NuGet packages
        run: dotnet pack Nops.slnx -c Release -o nupkgs

      - name: Verify packages
        run: |
          ls -la nupkgs/
          for pkg in nupkgs/*.nupkg; do
            echo "Package: $(basename "$pkg")"
          done

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nupkgs
          path: nupkgs/
