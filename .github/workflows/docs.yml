name: Docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]
  schedule:
    - cron: "0 6 * * 1" # weekly: catch external links that rot

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: .markdownlint-cli2.yaml

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude-path bin --exclude-path obj
            --accept 200,206,429
            --exclude '^https://github.com/atulmish/Nops/(security|stargazers)'
            '**/*.md'
          fail: true
