name: Docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]
  schedule:
    - cron: "0 6 * * 1" # weekly: catch external links that rot

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint-cli2.yaml

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude-path bin --exclude-path obj
            --accept 200,206,429
            --exclude '^https://github.com/atulmish/Nops/(security|stargazers|compare)'
            '**/*.md'
          fail: true
