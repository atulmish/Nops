version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    labels: ["dependencies"]
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    labels: ["area/CI", "dependencies"]
    schedule:
      interval: "weekly"
    groups:
      ci:
        patterns:
          - "*"
